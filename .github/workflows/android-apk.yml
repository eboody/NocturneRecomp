name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-apk ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android command-line build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK scaffold
        run: python scripts/build_android_apk.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturnerecomp-android-debug-apk
          path: out/android/nocturnerecomp-debug.apk
          if-no-files-found: error
